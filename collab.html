<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collaborate with Muhra</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --paper:#F5EEE3; --surface:#FFFCF7; --ink:#2C2018; --muted:#7A6858; --line:#E6DACA;
  --brand:#4A3123; --brand-soft:#EEE2D0; --on-brand:#FFF8EE;
  --good:#3E6B48; --good-soft:#E4EDDF; --bad:#A23B2E; --bad-soft:#F7E2DC;
  --font:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17120E; --surface:#211A15; --ink:#F2E9DC; --muted:#A8998A; --line:#3A2F27;
    --brand:#DCC3A0; --brand-soft:#3A2D22; --on-brand:#2C2018;
    --good:#8FC59A; --good-soft:#1F2E22; --bad:#EE9583; --bad-soft:#3D221D;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.logo{display:block;height:auto;width:140px}
.logo-light{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .logo-dark{display:none} :root:not([data-theme="light"]) .logo-light{display:block} }
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:22px;margin:0 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 20px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.field>span b{color:var(--bad);font-weight:500}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{resize:vertical;min-height:96px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--paper)}
.types input:checked + span{font-weight:600}
.types label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin:6px 0 18px}
.btn{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;margin-bottom:14px;background:var(--bad-soft);color:var(--bad)}
.done{text-align:center;padding:20px 0}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:480px){ .row{grid-template-columns:1fr} .card{padding:18px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span><img class="logo logo-dark" src="assets/muhra-logo.png" alt="Muhra"><img class="logo logo-light" src="assets/muhra-logo-light.png" alt="Muhra"></span>
    <button class="lang" id="langBtn" type="button">English</button>
  </div>
  <div class="card" id="card">
    <form id="form" novalidate>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div id="msg"></div>
      <label class="field"><span><span data-t="name"></span> <b>*</b></span><input class="input" id="name" autocomplete="name" maxlength="100" required></label>
      <div class="row">
        <label class="field"><span data-t="instagram"></span><input class="input" id="instagram" dir="ltr" placeholder="@yourhandle" maxlength="80" autocapitalize="off"></label>
        <label class="field"><span><span data-t="email"></span> <b>*</b></span><input class="input" id="email" type="email" dir="ltr" autocomplete="email" maxlength="200" required></label>
      </div>
      <div class="row">
        <label class="field"><span data-t="phone"></span><input class="input" id="phone" type="tel" dir="ltr" autocomplete="tel" maxlength="40" placeholder="01xxxxxxxxx"></label>
        <label class="field"><span data-t="city"></span><input class="input" id="city" maxlength="80"></label>
      </div>
      <div class="row">
        <label class="field"><span data-t="rateReel"></span><input class="input" id="rateReel" type="number" min="0" step="any" inputmode="decimal" dir="ltr"></label>
        <label class="field"><span data-t="ratePhoto"></span><input class="input" id="ratePhoto" type="number" min="0" step="any" inputmode="decimal" dir="ltr"></label>
      </div>
      <div class="field"><span data-t="types"></span><div class="types" id="types"></div></div>
      <label class="field"><span data-t="portfolio"></span><input class="input" id="portfolio" type="url" dir="ltr" placeholder="https://" maxlength="300"></label>
      <label class="field"><span data-t="message"></span><textarea class="input" id="message" maxlength="2000"></textarea></label>
      <label class="hp" aria-hidden="true">Website<input id="website" tabindex="-1" autocomplete="off"></label>
      <label class="consent"><input type="checkbox" id="consent"> <span data-t="consent"></span></label>
      <button class="btn" id="submit" type="submit" data-t="submit"></button>
    </form>
  </div>
  <p class="foot" data-t="foot"></p>
</div>
<script>
const sb = window.supabase.createClient('https://ltwzmjqrlvqbndmipufm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d3ptanFybHZxYm5kbWlwdWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDA3NTEsImV4cCI6MjA5MjY3Njc1MX0.pvp5NFr2tOTw_MJHIxHO9kK7cQ75QjL5N8AcewXIVOM');
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
const T = {
  ar: { title:'تعاوني مع مُهرة', lead:'بنحب نشتغل مع صناع محتوى بيعبّروا عن ستايلهم. املي البيانات دي في دقيقتين وفريقنا هيتواصل معاكي.', hi:'أهلاً {n}! ', name:'الاسم', instagram:'حساب إنستجرام', email:'الإيميل', phone:'رقم الموبايل / واتساب', city:'المدينة',
    rateReel:'سعر الريل (جنيه)', ratePhoto:'سعر الصورة / البوست (جنيه)', types:'نوع المحتوى اللي بتقدميه', portfolio:'لينك أعمال سابقة (اختياري)', message:'رسالة (اختياري)',
    consent:'موافقة إن مُهرة تتواصل معايا بخصوص التعاون ده.', submit:'إرسال', sending:'جاري الإرسال…', foot:'بياناتك بتوصل لفريق مُهرة بس.',
    doneT:'وصلتنا بياناتك 🤍', doneP:'شكراً! فريق مُهرة هيراجعها ويتواصل معاكي قريب.',
    errName:'من فضلك اكتبي اسمك.', errEmail:'من فضلك اكتبي إيميل صحيح.', errConsent:'من فضلك وافقي على التواصل.', errNet:'حصلت مشكلة. جربي تاني.',
    types_list:['ريلز / فيديو','صور','Unboxing','Try-on / Haul','Voice-over','فوتيج خام'] },
  en: { title:'Collaborate with Muhra', lead:'We love working with creators who show their own style. Fill this in (about 2 minutes) and our team will get back to you.', hi:'Hi {n}! ', name:'Name', instagram:'Instagram handle', email:'Email', phone:'Mobile / WhatsApp', city:'City',
    rateReel:'Rate per reel (EGP)', ratePhoto:'Rate per photo / post (EGP)', types:'Content you create', portfolio:'Portfolio link (optional)', message:'Message (optional)',
    consent:'I agree that Muhra may contact me about this collaboration.', submit:'Send', sending:'Sending…', foot:'Your details go to the Muhra team only.',
    doneT:'Got it 🤍', doneP:'Thank you! The Muhra team will review your details and get back to you soon.',
    errName:'Please enter your name.', errEmail:'Please enter a valid email.', errConsent:'Please agree to be contacted.', errNet:'Something went wrong. Please try again.',
    types_list:['Reels / video','Photos','Unboxing','Try-on / haul','Voice-over','Raw footage'] }
};
const TYPE_KEYS = ['reels','photos','unboxing','tryon','voiceover','raw'];
let lang = (navigator.language||'').toLowerCase().startsWith('ar') || !(navigator.language||'') ? 'ar' : 'en';
try{ const l = localStorage.getItem('collab.lang'); if(l==='ar'||l==='en') lang = l; }catch(e){}
const urlLang = new URLSearchParams(location.search).get('l'); if(urlLang==='ar'||urlLang==='en') lang = urlLang;   // the invite's language
let invite = null;
function apply(){
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.title = t.title;
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t[el.dataset.t]; });
  const checked = new Set([...document.querySelectorAll('#types input:checked')].map(x=>x.value));
  $('types').innerHTML = TYPE_KEYS.map((k,i)=>`<label><input type="checkbox" value="${k}" ${checked.has(k)?'checked':''}><span>${t.types_list[i]}</span></label>`).join('');
  if(invite) document.querySelector('[data-t="title"]').textContent = t.hi.replace('{n}', invite.display_name || '@'+invite.username) + t.title;
  $('langBtn').textContent = lang==='ar' ? 'English' : 'العربية';
}
$('langBtn').onclick = () => { lang = lang==='ar' ? 'en' : 'ar'; try{ localStorage.setItem('collab.lang', lang); }catch(e){} apply(); };
apply();
if(token){
  sb.rpc('ugc_invite_info', { p_token: token }).then(({ data })=>{ if(data){ invite = data; if(!$('instagram').value) $('instagram').value = '@'+data.username; apply(); } });
}
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const t = T[lang], msg = $('msg');
  const err = (m) => { msg.innerHTML = `<div class="msg" role="alert"></div>`; msg.firstChild.textContent = m; };
  if($('website').value) return;   // bot
  const name = $('name').value.trim(), email = $('email').value.trim();
  if(name.length < 2) return err(t.errName);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err(t.errEmail);
  if(!$('consent').checked) return err(t.errConsent);
  const btn = $('submit'); btn.disabled = true; btn.textContent = t.sending; msg.innerHTML = '';
  const types = [...document.querySelectorAll('#types input:checked')].map(x=>x.value);
  const { error } = await sb.rpc('ugc_submit_application', { p: { token, name, email, instagram: $('instagram').value.trim(), phone: $('phone').value.trim(), city: $('city').value.trim(),
    rate_reel: $('rateReel').value.trim(), rate_photo: $('ratePhoto').value.trim(), portfolio_url: $('portfolio').value.trim(), content_types: types, message: $('message').value.trim() } });
  btn.disabled = false; btn.textContent = t.submit;
  if(error) return err(error.message && !/fetch|network/i.test(error.message) ? error.message : t.errNet);
  $('card').innerHTML = `<div class="done"><div class="tick">✓</div><h1></h1><p class="lead"></p></div>`;
  $('card').querySelector('h1').textContent = t.doneT; $('card').querySelector('.lead').textContent = t.doneP;
};
</script>
</body>
</html>
